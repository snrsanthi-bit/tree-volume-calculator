plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-capybara

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/seeds.rb"
    - "tmp/**/*"
    - "vendor/**/*"
    - "Rakefile"
    - "config.ru"
    - "config/application.rb"
    - "config/boot.rb"
    - "config/environment.rb"
    - "config/environments/**/*"
    - "config/importmap.rb"
    - "config/puma.rb"
    - "config/initializers/assets.rb"
    - "config/initializers/content_security_policy.rb"
    - "config/initializers/devise.rb"
    - "config/initializers/filter_parameter_logging.rb"
    - "config/initializers/inflections.rb"
    - "config/initializers/permissions_policy.rb"

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false

Metrics/AbcSize:
  Max: 20

Metrics/BlockLength:
  Exclude:
    - "config/routes.rb"

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Enabled: false

RSpecRails/InferredSpecType:
  Enabled: false

Rails/NotNullColumn:
  Enabled: false
